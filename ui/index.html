        if (state.offset >= listed.total && listed.total > 0) {
          state.offset = Math.max(0, Math.floor((listed.total - 1) / state.filter.limit) * state.filter.limit);
          const retry = await rpc("guard/records", { filter: Object.assign({}, state.filter, { offset: state.offset }) });
          state.items = retry.items;
        }
        if (facets) paintFacets(facets);
        paintStats(stats);
        paintRows();
      }

      function paintStats(stats) {
        const host = $("stats");
        if (!host || !stats) return;
        host.replaceChildren();
        [["total", stats.total], ["pending", stats.pending], ["approved", stats.approved],
         ["rejected", stats.rejected], ["highRisk", stats.highRisk]].forEach(([key, value]) => {
          const chip = el("div", "chip");
          chip.append(el("b", null, String(value ?? 0)), el("span", null, t(`stats.${key}`)));
          host.append(chip);
        });
      }

      function paintRows() {
        const body = $("records");
        if (!body) return;
        body.replaceChildren();
        $("recordsEmpty").hidden = state.items.length !== 0;
        $("recordsEmpty").textContent = t("audit.empty");
        state.items.forEach((record) => {
          const row = el("tr", "clickable");
          row.tabIndex = 0;
          row.setAttribute("aria-selected", String(state.selected?.recordId === record.recordId));
          row.append(el("td", "mono", formatTime(record.createdAtMs)));
          row.append(el("td", "mono", record.recordId));
          row.append(el("td", null, record.operator));
          row.append(el("td", null, record.databaseName || t("common.none")));
          const riskCell = el("td");
          riskCell.append(badge(`risk-${record.riskLevel}`, riskLabel(record.riskLevel)));
          row.append(riskCell);
          const statusCell = el("td");
          statusCell.append(badge(`st-${record.status}`, statusLabel(record.status)));
          row.append(statusCell);
          row.append(el("td", "sql", record.sql));
          const open = () => { state.selected = record; paintDetail(record); paintRows(); };
          row.addEventListener("click", open);
          row.addEventListener("keydown", (event) => { if (event.key === "Enter") open(); });
          body.append(row);
        });
        const limit = state.filter.limit || 50;
        const from = state.total === 0 ? 0 : state.offset + 1;
        const to = Math.min(state.total, state.offset + state.items.length);
        $("pageInfo").textContent = t("audit.page", { from, to, total: state.total });
        $("prev").disabled = state.offset <= 0;
        $("next").disabled = to >= state.total;
      }

      function paintDetail(record) {
        $("detailCard").hidden = false;
        const kv = $("detailKv");
        kv.replaceChildren();
        const push = (name, value) => kv.append(el("dt", null, name), el("dd", null, value || t("common.none")));
        push(t("audit.colRecord"), record.recordId);
        const statusLine = el("dd");
        statusLine.append(badge(`st-${record.status}`, statusLabel(record.status)),
          document.createTextNode(" "), badge(`risk-${record.riskLevel}`, riskLabel(record.riskLevel)));
        kv.append(el("dt", null, t("audit.colStatus")), statusLine);
        push(t("audit.colOperator"), record.operator);
        push(t("modal.approver"), record.approver);
        push(t("modal.note"), record.note);
        push(t("audit.colDatabase"), record.databaseName);
        push(t("review.estimatedRows"), record.estimatedRows == null ? "" : String(record.estimatedRows));
        push(t("audit.colTime"), formatTime(record.createdAtMs));
        push("decidedAt", formatTime(record.decidedAtMs));
        push(t("review.hash"), record.sqlHash);
        push("digest", record.digest);
        $("detailSql").textContent = record.sql;
        const list = $("detailFindings");
        list.replaceChildren();
        record.findings.forEach((finding) => {
          const item = el("li");
          item.append(badge(`risk-${finding.risk}`, riskLabel(finding.risk)));
          const body = el("div", "msg");
          body.append(el("div", null, finding.message));
          body.append(el("div", "code", [codeLabel(finding.code), finding.statement].filter(Boolean).join(" · ")));
          item.append(body);
          list.append(item);
        });
        const pending = record.status === "pending";
        $("detailApprove").disabled = !pending;
        $("detailReject").disabled = !pending;
      }

      async function doVerify() {
        const report = await rpc("guard/verify", {}, 120000);
        const host = $("verifyBanner");
        host.replaceChildren();
        const banner = el("div", `banner ${report.ok ? "ok" : "bad"}`);
        banner.textContent = report.ok
          ? t("audit.verifyOk", { n: report.checked })
          : t("audit.verifyBad", { id: report.firstBrokenRecord || "?", n: (report.decisionMismatches || []).length });
        host.append(banner);
      }

      async function doExport() {
        // 不再传 limit/offset：导出的语义是"符合条件的全部记录"，分页由后端忽略。
        const result = await rpc("guard/export", { filter: state.filter }, 120000);
        const bytes = new TextEncoder().encode(result.csv);
        const exported = result.exported ?? result.total;
        // 导出条数和总条数不一致时必须说出来，否则用户会以为文件是全量的。
        const summary = result.truncated
          ? t("audit.exportTruncated", { n: exported, total: result.total })
          : "";
        const transfer = bridge.fileTransfer;
        if (transfer && bridge.capabilities?.fileTransfer?.beginSave) {
          const target = await transfer.beginSave({ name: result.filename, size: bytes.byteLength });
          await transfer.write(target.handleId, 0, bytes);
          await transfer.finish(target.handleId);
          toast(t("audit.exportDone", { n: exported }) + summary, Boolean(summary));
          return;
        }
        if (bridge.capabilities?.clipboardWrite && bridge.clipboard) {
          await bridge.clipboard.writeText(result.csv);
          toast(t("audit.exportCopied", { n: exported }) + summary, Boolean(summary));
          return;
        }
        openModal(result.filename, (body) => {
          const area = document.createElement("textarea");
          area.rows = 14;
          area.value = result.csv;
          body.append(el("div", "hint", t("audit.exportInline") + summary), area);
          return {};
        }, () => true);
      }

      /* ---------- rules tab ---------- */

      function paintRules() {
        const rules = state.rules;
        DETECTORS.forEach((key) => { const input = $(key); if (input) input.checked = rules[key] !== false; });
        $("approvalFromLevel").value = rules.approvalFromLevel || "high";
        $("largeScanRowThreshold").value = String(rules.largeScanRowThreshold ?? 100000);
        $("autoAllowReadOnly").checked = rules.autoAllowReadOnly !== false;
        // 默认就是开启，所以只有显式存过 false 才不勾。
        $("requireDistinctApprover").checked = rules.requireDistinctApprover !== false;
        $("sensitiveColumns").value = (rules.sensitiveColumns || []).join("\n");
        $("whitelistDatabases").value = (rules.whitelistDatabases || []).join("\n");
        $("whitelistKeywords").value = (rules.whitelistKeywords || []).join("\n");
        $("approvers").value = (rules.approvers || []).join("\n");
        $("scopeApprovers").value = Object.entries(rules.scopeApprovers || {})
          .map(([scope, names]) => `${scope} = ${names.join(", ")}`)
          .join("\n");
      }

      function lines(id) {
        return $(id).value.split("\n").map((entry) => entry.trim()).filter(Boolean);
      }

      /// `prod = alice, bob` 一行一个库 → { prod: ["alice", "bob"] }。
      /// 没有 `=` 的行整行忽略：猜不出用户是想配库还是配人，错解析会改到审批权限，静默丢掉
      /// 更好。丢掉之后 saveRules 用 sidecar 回传的规则重新 paintRules()，那行会消失，
      /// 用户能看出来它没被接受。
      function scopeApproversFrom(id) {
        const scopes = {};
        lines(id).forEach((line) => {
          const split = line.indexOf("=");
          if (split < 0) return;
          const scope = line.slice(0, split).trim();
          if (!scope) return;
          scopes[scope] = line.slice(split + 1).split(",").map((name) => name.trim()).filter(Boolean);
        });
        return scopes;
      }

      async function saveRules() {
        const rules = Object.assign({}, state.rules);
        DETECTORS.forEach((key) => { rules[key] = $(key).checked; });
        rules.approvalFromLevel = $("approvalFromLevel").value;
        rules.largeScanRowThreshold = Number.parseInt($("largeScanRowThreshold").value, 10);
        rules.autoAllowReadOnly = $("autoAllowReadOnly").checked;
        rules.requireDistinctApprover = $("requireDistinctApprover").checked;
        rules.sensitiveColumns = lines("sensitiveColumns");
        rules.whitelistDatabases = lines("whitelistDatabases");
        rules.whitelistKeywords = lines("whitelistKeywords");
        rules.approvers = lines("approvers");
        rules.scopeApprovers = scopeApproversFrom("scopeApprovers");
        state.rules = await rpc("guard/rules/save", { rules });
        paintRules();
        toast(t("rules.saved"));
      }

      async function loadRules() {
        state.rules = await rpc("guard/rules/get");
        paintDetectors();
        paintRules();
      }

      /* ---------- tabs, theme, boot ---------- */

      function selectTab(name) {
        document.querySelectorAll("nav button[data-tab]").forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.tab === name));
        });
        ["review", "audit", "rules"].forEach((tab) => { $(`tab-${tab}`).hidden = tab !== name; });
        if (name === "audit") refreshAudit().catch(() => {});
      }

      function applyEnv() {
        const locale = (bridge.locale || "en").toLowerCase();
        state.locale = bridge.locale || "en";
        state.dict = locale.startsWith("zh") ? I18N.zh : I18N.en;
        const appearance = bridge.theme?.appearance;
        if (appearance) document.documentElement.dataset.dbxTheme = appearance;
        paintStatic();
      }

      /* 操作人身份。真机探测已确认：宿主不提供任何身份字段（context 是 {}，bridge 的
         39 个 key 里没有 user/account/session），所以 operator 只能是**自报**的——
         哈希链能证明记录没被改过，证明不了是谁敲的，界面上不能把话说满。
         名字存在宿主 storage（manifest 声明 host.storage）而不是 sidecar 的 meta 表：
         它跟着这台机器上的 DBX 走，重装插件不丢，也不会混进审计数据。
         拿不到 storage（旧宿主 / 权限被拒）时降级为只记在当前页面，并如实提示用户。 */
      const OPERATOR_KEY = "sqlGuard.operator";

      function hostStorage() {
        const storage = bridge?.storage;
        return storage && typeof storage.get === "function" && typeof storage.set === "function" ? storage : null;
      }

      function operatorStatus(key) {
        const hint = $("operatorStatus");
        if (hint) hint.textContent = key ? t(key) : "";
      }

      async function loadOperator() {
        const storage = hostStorage();
        if (!storage) { operatorStatus("review.operatorNoStore"); return; }
        try {
          const saved = await storage.get(OPERATOR_KEY);
          if (typeof saved === "string" && saved.trim()) $("operator").value = saved.trim();
        } catch (error) {
          operatorStatus("review.operatorNoStore");
        }
      }

      /// 提交和审批前都会调一次，避免刚改的名字因为没触发 change 而丢。
      async function saveOperator() {
        const storage = hostStorage();
        if (!storage) return false;
        const name = $("operator").value.trim();
        try {
          if (name) await storage.set(OPERATOR_KEY, name);
          else if (typeof storage.delete === "function") await storage.delete(OPERATOR_KEY);
          operatorStatus(name ? "review.operatorSaved" : "");
          return true;
        } catch (error) {
          operatorStatus("review.operatorNoStore");
          return false;
        }
      }

      /* 常用库列表。宿主不会把用户配的连接交给插件（插件模型里连接是插件私有的，
         没声明 connection-provider 就一个也看不见，context 也因此是 {}），所以这里
         退而求其次：把用过的库名记在宿主 storage 里，做成可选可输的 datalist。
         它只是个**标签补全**，不代表真的能连上那个库——审计记录里的 database
         本来就是自报的作用域标签。 */
      const DATABASES_KEY = "sqlGuard.databases";
      const MAX_DATABASES = 20;

      function paintDatalist() {
        const list = $("dbOptions");
        if (!list) return;
        list.replaceChildren(...state.databases.map((name) => {
          const option = document.createElement("option");
          option.value = name;
          return option;
        }));
      }

      async function loadDatabases() {
        const storage = hostStorage();
        if (!storage) return;
        try {
          const saved = await storage.get(DATABASES_KEY);
          if (Array.isArray(saved)) {
            state.databases = saved.filter((name) => typeof name === "string" && name.trim()).slice(0, MAX_DATABASES);
            paintDatalist();
          }
        } catch (error) {
          // 读不出来就当没有历史，输入框照常可用，不值得打扰用户。
        }
      }

      /// 记住一个库名：最近用的排最前，大小写不同算同一个（与审计分面的归并规则一致），
      /// 超出上限就丢掉最久没用的。
      async function rememberDatabase(name) {
        const value = (name || "").trim();
        if (!value) return;
        const rest = state.databases.filter((entry) => entry.toLowerCase() !== value.toLowerCase());
        state.databases = [value, ...rest].slice(0, MAX_DATABASES);
        paintDatalist();
        const storage = hostStorage();
        if (!storage) return;
        try {
          await storage.set(DATABASES_KEY, state.databases);
        } catch (error) {
          // 存不进宿主也已经在内存里生效了，本次会话照常补全。
        }
      }

      /// 宿主按连接只读接口的诊断读取（不是产品功能，被 SHOW_HOST_DIAGNOSTICS 收着）。
      /// 唯一目的：把
      /// `getPlanCapabilities` / `getTableMetadata` 的**原始返回**摊出来，好判断"估算影响
      /// 行数"和"真实列类型"这两条路在真机上能走多远。凭据一概不碰。
      function bridgeMethod(name) {
        const host = window.dbxPlugin || {};
        return typeof host[name] === "function" ? host[name].bind(host) : null;
      }

      /// 三颗宿主诊断按钮（读 context / 计划能力 / 表结构）的总开关，默认关。
      /// 它们回答「宿主此刻告诉我什么」，是开发期的问题：审批人点它不会多出任何结论，留在界面上反而像缺了一步。关掉后 handler、可用性判定和文案都在，改 true 整块回来。AI 卡片上那串方法名/能力清单走同一个开关（见 `paintAiStatus`）。
      const SHOW_HOST_DIAGNOSTICS = false;
      $("hostDiagnostics").hidden = !SHOW_HOST_DIAGNOSTICS;

      function hostProbeTargets() {
        const context = state.context || {};
        return {
          connectionId: $("hostConnection").value.trim() || context.connectionId || context.id || "",
          table: $("hostTable").value.trim() || context.table || "",
          database: context.database || context.databaseName || undefined,
          schema: context.schema || undefined
        };
      }

      async function probeHost(method, args) {
        const call = bridgeMethod(method);
        if (!call) {
          const message = t("host.unavailable", { method });
          $("hostBody").textContent = message;
          $("hostStatus").textContent = message;
          toast(message, true);
          return;
        }
        $("hostStatus").textContent = `${method}…`;
        try {
          const value = await call(args);
          $("hostBody").textContent = `${method}(${brief(args)}) ->\n${JSON.stringify(value, null, 2)}`;
          $("hostStatus").textContent = t("host.done", { method });
        } catch (error) {
          // 宿主的报错原话要留在卡片里（理由同 AI 对话那条）：toast 会消失，而"连接没打开"
          // 和"这个宿主没有这个接口"是两种完全不同的处置。
          const message = error?.message || String(error);
          $("hostBody").textContent = [
            t("host.failed", { method, message }),
            "",
            `${method}(${brief(args)})`
          ].join("\n");
          $("hostStatus").textContent = t("host.failed", { method, message });
          toast(t("host.failed", { method, message }), true);
        }
      }

      /// 宿主把 TableContext 推进来时（右键进入、或用户换了表），把 connectionId 和表名填进
      /// 这张卡片。已手填过的值不覆盖——那是用户在看另一条连接的结果，被推送冲掉会让人
      /// 分不清哪份返回属于哪条连接。
      function syncHostInputs() {
        const context = state.context || {};
        if (!$("hostConnection").value) { $("hostConnection").value = context.connectionId || context.id || ""; }
        if (!$("hostTable").value) { $("hostTable").value = context.table || ""; }
        syncHostAvailability();
      }

      /// 没有 connectionId 时那几个按钮点下去只会换来红字报错——那不叫反馈，是让人以为自己
      /// 把插件用坏了。所以直接关掉，并把"为什么关着、要怎样才能点亮"写在状态行里。
      /// 宿主没给 context 是入口问题，不是故障。
      function syncHostAvailability() {
        const targets = hostProbeTargets();
        const caps = (window.dbxPlugin || {}).capabilities || {};
        $("hostPlanCaps").disabled = !targets.connectionId || caps.planApi === false;
        // 读计划的按钮同样要 connectionId：explainPlan 只服务已打开的连接。但它不需要表名——
        // 计划问的是「这条语句会扫多少行」，表名从语句里来。
        $("hostPlan").disabled = !targets.connectionId || caps.planApi === false;
        $("hostSchema").disabled = !targets.connectionId || !targets.table
          || caps.schemaMetadataApi === false;
        const hint = $("hostAvail");
        // 可用性提示写在自己的行里，不和 #hostStatus 抢。抢的话只有两种结果：一句泛泛的
        // 「还缺个表名」盖掉用户刚读到的拒绝原因，或者按钮灰了却没人说为什么——都让人以为插件坏了。
        if (!targets.connectionId) {
          hint.textContent = t("host.needsConnection");
        } else if (caps.planApi === false) {
          hint.textContent = t("host.planApiOff");
        } else if (SHOW_HOST_DIAGNOSTICS && !targets.table) {
          // 「还缺一个表名」只有那颗真需要表名的按钮在界面上时才是有效信息；诊断按钮收起后
          // 还写着它，就是让一个人对着亮着的按钮读一句不相干的解释。
          hint.textContent = t("host.needsTable");
        } else {
          hint.textContent = "";
        }
        // 换连接 = 缓存作废：上一条连接的方言和「支不支持估算计划」对这条不成立。
        if (targets.connectionId !== state.planCapsKey) {
          state.planCaps = null;
          state.planCapsKey = null;
          paintPlanSupport();
        }
      }

      function doHostProbe() {
        const host = window.dbxPlugin || {};
        const context = state.context || {};
        $("hostBody").textContent = [
          `locale: ${host.locale}`,
          `theme: ${host.theme && host.theme.appearance}`,
          `contributionId: ${host.contributionId}`,
          `context: ${JSON.stringify(context)}`,
          `capabilities: ${JSON.stringify(host.capabilities || {})}`,
          `bridge keys: ${Object.keys(host).sort().join(", ")}`,
          // 上游只列了 bridge 的顶层 key；每个命名空间里有什么本地测不出来，而
          // "宿主还能告诉我们什么"这个问题只能靠列出来回答。
          `namespaces: ${Object.entries(host)
            .filter(([, value]) => value && typeof value === "object")
            .map(([name, value]) => `${name}[${Object.keys(value).sort().join(",")}]`)
            .join(" ")}`
        ].join("\n");
        $("hostStatus").textContent = t("host.done", { method: "context" });
        // 放在后面：这次调用本身成功了，但紧接着的可用性判断一旦发现没有 connectionId，
        // 就要把"为什么那两个还是关着的"覆盖在成功提示上。
        syncHostInputs();
      }

      function requireProbeConnection() {
        const targets = hostProbeTargets();
        if (!targets.connectionId) {
          toast(t("host.noConnection"), true);
          return null;
        }
        return targets;
      }

      async function doHostPlanCaps() {
        const targets = requireProbeConnection();
        if (!targets) return;
        await probeHost("getPlanCapabilities", targets.connectionId);
      }

      async function doHostSchema() {
        const targets = requireProbeConnection();
        if (!targets) return;
        if (!targets.table) { toast(t("host.noTable"), true); return; }
        await probeHost("getTableMetadata", targets);
      }

      async function boot() {
        if (!bridge) { $("boot").textContent = I18N.en["boot.noBridge"]; return; }
        $("boot").textContent = "…";
        try {
          await bridge.ready;
        } catch (error) {
          $("boot").textContent = `${I18N.en["boot.failed"]} ${error?.message || error}`;
          return;
        }
        applyEnv();
        window.addEventListener("dbx-plugin-env", applyEnv);
        if (typeof bridge.onContext === "function") {
          bridge.onContext((next) => { state.context = next || {}; syncContextInputs(); syncHostInputs(); });
        }
        state.context = bridge.context || {};
        syncContextInputs();

        const info = await rpc("guard/ping").catch(() => null);
        $("meta").textContent = info ? `${info.plugin} ${info.version} · ${info.store}` : "";
        $("boot").hidden = true;
        // 这张卡片常驻：它装着「读取估算计划行数」和那两格手填的连接/表名，与有没有
        // SQL、有没有解析出模型无关，藏在报告后面反而没人去点。
        $("hostCard").hidden = false;
        syncHostInputs();

        // 先于 loadRules()：操作人名字来自宿主 storage，与 sidecar 是否存活无关，
        // 不该因规则读取失败而跟着不加载。
        await loadOperator();
        await loadDatabases();
        await loadRules();
        paintStatic();
        selectTab("review");
      }

      document.querySelectorAll("nav button[data-tab]").forEach((button) => {
        button.addEventListener("click", () => selectTab(button.dataset.tab));
      });
      $("analyze").addEventListener("click", () => doAnalyze().catch(() => {}));
      $("submit").addEventListener("click", () => doSubmit().catch(() => {}));
      // change 而不是 input：每敲一个字符就写一次宿主 storage 没必要，失焦时存一次就够。
      $("operator").addEventListener("change", () => { saveOperator(); });
      $("clear").addEventListener("click", () => {
        $("sql").value = "";
        // 走 clearPlanRows 而不是直接清空输入框：行数和它对应的那段 SQL 是成对状态，
        // 只清文本会留下一个「还挂在旧语句上」的数字。
        clearPlanRows();
        state.report = null; state.record = null; state.reportSql = null;
        $("reportBody").replaceChildren(el("div", "empty", t("review.noReport")));
        $("recordCard").hidden = true;
        // 报告没了，围绕它的预审意见也就没有意义了，一并收掉。
        $("aiCard").hidden = true;
        $("aiBody").replaceChildren();
      });
      $("aiReview").addEventListener("click", () => doAiReview().catch(() => {}));
      $("aiChat").addEventListener("click", () => doAiChat().catch(() => {}));
      $("hostProbe").addEventListener("click", doHostProbe);
      $("hostConnection").addEventListener("input", syncHostAvailability);
      $("hostTable").addEventListener("input", syncHostAvailability);
      $("hostPlanCaps").addEventListener("click", () => doHostPlanCaps().catch(() => {}));
      $("hostPlan").addEventListener("click", () => doReadHostPlan().catch(() => {}));
      // SQL 或连接一变，已有的计划读数就可能属于「另一条语句、另一条连接」：让它在下一次
      // 分析前就地作废，而不是带着它跑出一份归因错误的报告。
      $("sql").addEventListener("input", () => { retirePlanRows(); });
      $("hostConnection").addEventListener("input", () => { retirePlanRows(); });
      $("hostSchema").addEventListener("click", () => doHostSchema().catch(() => {}));
      $("approve").addEventListener("click", () => { if (state.record) askDecision(state.record, "approved"); });
      $("reject").addEventListener("click", () => { if (state.record) askDecision(state.record, "rejected"); });
      $("detailApprove").addEventListener("click", () => { if (state.selected) askDecision(state.selected, "approved"); });
      $("detailReject").addEventListener("click", () => { if (state.selected) askDecision(state.selected, "rejected"); });
      $("refresh").addEventListener("click", () => { state.offset = 0; refreshAudit().catch(() => {}); });
      $("verify").addEventListener("click", () => doVerify().catch(() => {}));
      $("export").addEventListener("click", () => doExport().catch(() => {}));
      $("prev").addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - (state.filter.limit || 50));
        refreshAudit().catch(() => {});
      });
      $("next").addEventListener("click", () => {
        state.offset += state.filter.limit || 50;
        refreshAudit().catch(() => {});
      });
      ["fRisk", "fStatus", "fDatabase", "fOperator", "fLimit"].forEach((id) => {
        $(id).addEventListener("change", () => { state.offset = 0; refreshAudit().catch(() => {}); });
      });
      $("fKeyword").addEventListener("keydown", (event) => {
        if (event.key === "Enter") { state.offset = 0; refreshAudit().catch(() => {}); }
      });
      $("saveRules").addEventListener("click", () => saveRules().catch(() => {}));
      $("reloadRules").addEventListener("click", () => loadRules().catch(() => {}));
      $("overlay").addEventListener("click", (event) => { if (event.target === $("overlay")) closeModal(); });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeModal(); });

      boot().catch((error) => {
        $("boot").hidden = false;
        $("boot").textContent = `${I18N.en["boot.failed"]} ${error?.message || error}`;
      });
    </script>
  </body>
</html>
